[project]
name = "portflow-backend"
version = "0.1.0"
description = "PortPulse AI — FastAPI services: SimPy simulation, LightGBM forecasting, Isolation Forest anomaly detection, OR-Tools CP-SAT berth/crane optimisation, IBM Bob agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "ortools>=9.10",
    "simpy>=4.1",
    "httpx>=0.27",
    "mcp>=2.2.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Legacy bulk-style rules stay excluded (262 line-too-long etc. — churn, not correctness).
# F841 was re-enabled 2026-09 after the dead-local backlog was cleared; new unused
# assignments fail CI. Any future exception needs `# noqa: F841` + a written reason.
ignore = ["E501", "E701", "E702", "I001", "UP017", "UP037"]

[tool.ruff.lint.per-file-ignores]
"app/services/forecasting.py" = ["F401"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: full-engine / DB / model-training tests (~3 min total). Deselect with -m 'not slow' for a ~5s fast pass.",
]
